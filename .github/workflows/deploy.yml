name: LLM RAG App - CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'LLM_RAG_APP/backend/**'
      - '.github/workflows/deploy.yml'

env:
  IMAGE_NAME: llm-rag-app
  REGISTRY: docker.io
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (for multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./LLM_RAG_APP/backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest

      # Step 5: Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull latest image
            docker pull ${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest
            
            # Stop and remove existing container
            docker stop llm-rag || true
            docker rm llm-rag || true
            
            # Run new container
            docker run -d \
              --name llm-rag \
              -p 8000:8000 \
              -e OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest

      # Step 6: Cleanup (optional)
      - name: Clean up unused Docker images
        if: always()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: docker image prune -f || true

      # Step 7: Notify success
      - name: Deployment Success
        if: success()
        run: echo "✅ Deployed build #${{ github.run_number }} successfully"

      # Step 8: Notify failure
      - name: Deployment Failure
        if: failure()
        run: echo "❌ Build #${{ github.run_number }} failed - check logs"
